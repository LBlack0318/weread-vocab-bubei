name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 自检（本地 mock，不联网）
        run: python scripts/selftest.py

  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 确认没有提交凭据文件
        run: |
          set -e
          for f in api_key bbdc_cookies.txt .env; do
            if [ -e "$f" ]; then echo "::error::不该提交 $f"; exit 1; fi
          done
          if grep -rIl --exclude-dir=.git --exclude-dir=.github \
               -E "JSESSIONID=[0-9A-F]{20,}|wrk-[A-Za-z0-9]{20,}" .; then
            echo "::error::检测到疑似真实凭据"; exit 1
          fi
          echo "OK: 没有发现凭据"
